name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/android/**', 'apps/web/package.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Keystore (only when the secret exists)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "QROOVE_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          QROOVE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QROOVE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QROOVE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK
        run: |
          v=$(node -p "require('../web/package.json').version")
          f=$(ls app/build/outputs/apk/release/*.apk)
          mkdir -p out && cp "$f" "out/qroove-$v$( [[ $f == *unsigned* ]] && echo -unsigned ).apk"
          (cd out && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qroove-android
          path: apps/android/out/*
      - name: Attach to the GitHub release (tags)
        if: startsWith(github.ref, 'refs/tags/v') && env.QROOVE_KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/out/*
