name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/mobile/**', 'apps/web/package.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/mobile/**', 'apps/web/src/**', 'tests/android-tv/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Capacitor sync
        working-directory: apps/mobile
        run: pnpm exec cap sync android
      - name: Keystore (only when the secret exists)
        working-directory: apps/mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "QROOVE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: apps/mobile/android
        env:
          QROOVE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QROOVE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QROOVE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Name the APK
        working-directory: apps/mobile/android
        run: |
          v=$(node -p "require('../../web/package.json').version")
          f=$(ls app/build/outputs/apk/release/*.apk)
          mkdir -p out && cp "$f" "out/qroove-$v$( [[ $f == *unsigned* ]] && echo -unsigned ).apk"
          # The Play Store takes the app bundle (.aab), signed with the upload key.
          cp app/build/outputs/bundle/release/*.aab "out/qroove-$v.aab"
          (cd out && sha256sum *.apk *.aab > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qroove-android
          path: apps/mobile/android/out/*
      - name: Attach to the GitHub release (tags)
        if: startsWith(github.ref, 'refs/tags/v') && env.QROOVE_KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/out/*

  # Android TV: GitHub's Linux runners have KVM (the VPS has none). A debug build of this branch points
  # at the server built from this branch, on the runner, and a script drives it with the remote.
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start the server (in-memory, no credentials)
        run: |
          PORT=3100 NODE_ENV=development REPO_DRIVER=memory RATE_LIMIT_OFF=1 \
            PUBLIC_BASE_URL=http://10.0.2.2:3100 nohup node apps/server/dist/main.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3100/api/health && break; sleep 1; done
      - name: Debug app pointed at the runner
        working-directory: apps/mobile
        run: |
          node -e "const f='capacitor.config.json',c=require('./'+f);c.server.url='http://10.0.2.2:3100';c.server.androidScheme='http';c.server.cleartext=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          pnpm exec cap sync android
          cd android && ./gradlew --no-daemon assembleDebug
          echo "APP_ID=$(node -p "require('../capacitor.config.json').appId")" >> "$GITHUB_ENV"
      - name: R8 release build, signed with the debug key (test only)
        working-directory: apps/mobile
        run: |
          git checkout capacitor.config.json
          pnpm exec cap sync android
          cd android && ./gradlew --no-daemon assembleRelease
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android \
            --out "$GITHUB_WORKSPACE/release-test.apk" app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Android TV emulator (Android 11, like the owner's projector)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            node tests/android-tv/smoke.mjs
            bash tests/android-tv/release-smoke.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-screens
          path: |
            tv-shots/
            server.log
